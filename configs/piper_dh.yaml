# Piper dual-arm kinematic / joint limit summary used by the virtual dataset converter.
# Full URDF chain lives in softfold/kinematics.py (matches piper_description.urdf).

robot: piper_dual
dof_per_arm: 6
grippers: 2
action_dim: 14  # 12 arm joints + 2 grippers (proposal "12-D" refers to arm joints)

tcp_offset_xyz_m: [0.0, 0.0, 0.1358]
tcp_offset_rpy_rad: [1.5708, 0.0, 0.0]

joint_limits_rad:
  - [-2.618, 2.618]   # j1
  - [0.0, 3.14]       # j2
  - [-2.967, 0.0]     # j3
  - [-1.745, 1.745]   # j4
  - [-1.22, 1.22]     # j5
  - [-2.0944, 2.0944] # j6

default_station: configs/calibration/station.json

ik:
  max_iters: 60
  pos_tol_m: 0.001
  rot_tol_rad: 0.02
  damp: 0.01
  smooth_window: 5
  min_success_ratio: 0.7
